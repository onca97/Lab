name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: APK bauen
        run: gradle assembleRelease --no-daemon

      - name: Version auslesen und APK umbenennen
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp app/build/outputs/apk/release/app-release.apk labyrinth-v$VERSION.apk

      - uses: actions/upload-artifact@v4
        with:
          name: labyrinth-v${{ env.VERSION }}
          path: labyrinth-v${{ env.VERSION }}.apk
